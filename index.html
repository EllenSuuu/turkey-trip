<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>链接不完整</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #1f2329;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fff7e6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fa8c16;
    }
    .icon svg { width: 34px; height: 34px; }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 600;
    }
    p {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.6;
      color: #4e5969;
    }
    .tips {
      margin: 20px 0 0;
      padding: 16px 18px;
      background: #f7f8fa;
      border-radius: 10px;
      text-align: left;
    }
    .tips ul {
      margin: 0;
      padding-left: 20px;
    }
    .tips li {
      font-size: 13px;
      line-height: 1.8;
      color: #4e5969;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #17171a; color: #e5e6eb; }
      .card { background: #23232a; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); }
      .icon { background: #3a2e1a; }
      p, .tips li { color: #a9aeb8; }
      .tips { background: #1c1c21; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="alert" aria-live="polite">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1>链接不完整</h1>
      <p>链接缺少必要信息，暂时无法访问。</p>
      <div class="tips">
        <ul>
          <li>若链接由他人分享：请让分享者重新发送完整的分享链接，若仍无法打开，请联系应用创建者参考如下指引重新发布。</li>
          <li>若你是应用创建者：可在 WorkBuddy 中重新发布，生成新的完整链接后再分享。<br />重新发布操作指引：【先下线应用后重新发布：打开 WorkBuddy 客户端 - 点击头像 - 设置 - 数据管理 - 应用 - 右侧三个点 - 下线应用 - 再发布应用，获取新的应用链接】</li>
        </ul>
      </div>
    </main>
  </div>
</body>
</html>
